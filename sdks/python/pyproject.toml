[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgecode-sdk"
version = "0.1.0"
description = "Official Python SDK for integrating with ForgeCode AI agent CLI. Provides async-generator streaming API, session management, MCP server integration, and Pydantic model validation for AI-powered applications."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]
keywords = [
    "ai-agent",
    "ai-sdk",
    "anthropic-claude",
    "async-generator",
    "claude-agent",
    "cli-automation",
    "code-automation",
    "developer-tools",
    "forgecode",
    "llm-integration",
    "mcp-client",
    "mcp-sdk",
    "model-context-protocol",
    "openai-alternative",
    "python-sdk",
    "streaming-api"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.9",
  "pydantic>=2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/forgecode"]
