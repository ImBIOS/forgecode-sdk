[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgecode-sdk"
version = "0.1.0"
description = "Python SDK for the ForgeCode CLI (forge binary)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.9",
  "pydantic>=2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/forgecode"]